<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============ AUTENTICACAO ============ -->
  <main id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <h1 class="brand">Gastos<span>.</span></h1>
      <p class="muted">Controle suas despesas pessoais, mês a mês.</p>

      <form id="login-form" class="stack">
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Entrar</button>
        <p class="switch">Não tem conta? <a href="#" data-show="signup-form">Criar conta</a></p>
      </form>

      <form id="signup-form" class="stack" hidden>
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <label>Senha<input name="password" type="password" required minlength="8" autocomplete="new-password">
          <small class="muted">Mínimo 8 caracteres, com minúscula, maiúscula e número.</small></label>
        <button class="btn primary" type="submit">Criar conta</button>
        <p class="switch">Já tem conta? <a href="#" data-show="login-form">Entrar</a></p>
      </form>

      <form id="confirm-form" class="stack" hidden>
        <p>Enviamos um código para <strong id="confirm-email"></strong>.</p>
        <label>Código de verificação<input name="code" inputmode="numeric" required autocomplete="one-time-code"></label>
        <button class="btn primary" type="submit">Confirmar</button>
        <p class="switch"><a href="#" id="resend-code">Reenviar código</a></p>
      </form>

      <p id="auth-msg" class="msg" role="alert"></p>
    </div>
  </main>

  <!-- ============ APP ============ -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1 class="brand small">Gastos<span>.</span></h1>
      <div class="topbar-right">
        <span id="user-email" class="muted"></span>
        <button id="logout" class="btn ghost">Sair</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel summary">
        <div class="month-nav">
          <button class="btn icon" id="prev-month" aria-label="Mês anterior">‹</button>
          <h2 id="month-label"></h2>
          <button class="btn icon" id="next-month" aria-label="Próximo mês">›</button>
        </div>
        <p class="total-label muted">Total do mês</p>
        <p id="total" class="total">R$ 0,00</p>
        <p id="count" class="muted"></p>
        <ul id="categories" class="categories"></ul>
      </section>

      <section class="panel">
        <h2 id="form-title">Nova despesa</h2>
        <form id="expense-form" class="grid-form">
          <label class="span-2">Descrição<input name="description" required maxlength="120" placeholder="Ex.: Supermercado"></label>
          <label>Valor (R$)<input name="amount" type="number" step="0.01" min="0.01" required placeholder="0,00"></label>
          <label>Data<input name="date" type="date" required></label>
          <label class="span-2">Categoria
            <select name="category" required></select>
          </label>
          <div class="span-2 form-actions">
            <button class="btn primary" type="submit" id="save-btn">Adicionar</button>
            <button class="btn ghost" type="button" id="cancel-edit" hidden>Cancelar</button>
          </div>
        </form>
        <p id="form-msg" class="msg" role="alert"></p>
      </section>

      <section class="panel span-full">
        <h2>Despesas</h2>
        <p id="empty" class="muted" hidden>Nenhuma despesa neste mês ainda.</p>
        <ul id="expense-list" class="expense-list"></ul>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
